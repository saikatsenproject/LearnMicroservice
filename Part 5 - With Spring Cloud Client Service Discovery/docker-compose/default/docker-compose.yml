## This docker compose use to create how different microservice connect
## with each other and run.Docker will create the container base on serial no.
## But the diffeculties is it will throw an exception while create a ccounts,loans,
## cards because it's directly depends on config server start.
services:
  configserver:
    image: "saikatsenproject/configserver:part5"
    container_name: configserver-ms
    ports:
      - 8071:8071
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config
  eurekaserver:
    image: "saikatsenproject/eurekaserver:part5"
    container_name: eurekaserver-ms
    ports:
      - 9081:9081
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:9081/eureka/"
    healthcheck:
      test: "curl --fail --silent localhost:9081/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-base-config
  accounts:
    image: "saikatsenproject/accounts:part5"
    container_name: accounts-ms
    ports:
      - 8081:8080
    environment:
      SPRING_APPLICATION_NAME: "accounts"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  cards:
    image: "saikatsenproject/cards:part5"
    container_name: cards-ms
    ports:
      - 8091:8090
    environment:
      SPRING_APPLICATION_NAME: "cards"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  cards1: # We are creating another instance of cards because of load balancing, use db except h2
    image: "saikatsenproject/cards:part5"
    container_name: cards1-ms
    ports:
      - 8092:8090
    environment:
      SPRING_APPLICATION_NAME: "cards"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  loans:
    image: "saikatsenproject/loans:part5"
    container_name: loans-ms
    ports:
      - 9001:9000
    environment:
      SPRING_APPLICATION_NAME: "loans"
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:
  microservice:
    driver: "bridge"