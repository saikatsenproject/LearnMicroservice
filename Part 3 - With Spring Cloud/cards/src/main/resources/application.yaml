server:
  port: 8090
spring:
  application:
    name: cards
  datasource:
    url: jdbc:h2:mem:microServiceDB
    username: saikat
    password: saikat
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
  h2:
    console:
      enabled: true
  config:
    import: "optional:configserver:http://localhost:8071/"
  profiles:
    active: dev
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"